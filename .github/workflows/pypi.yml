# Publishes to PyPI on every version tag, using PyPI's Trusted Publishing (no token stored here).
#
# One-time setup:
#   1. On pypi.org: Account settings > Publishing > Add a new pending publisher
#        PyPI project name: wedontlikeit   Owner: PRMEidiot   Repository: WeDontLikeIt
#        Workflow name: pypi.yml           Environment: pypi
#   2. On GitHub: Settings > Secrets and variables > Actions > Variables
#        add PUBLISH_TO_PYPI = true
# Until step 2 is done this workflow is skipped, so tags don't fail because of it.
name: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $version"; exit 1; }
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # lets PyPI verify this run came from this repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
